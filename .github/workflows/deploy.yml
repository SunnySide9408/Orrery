name: Deploy

# Publishes main to GitHub Pages: https://sunnyside9408.github.io/Orrery/
# Runs on every push to main (every merged pull request), and by hand from
# Actions > Deploy > Run workflow. Needs Settings > Pages > Source set to
# "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -- --base-href /${{ github.event.repository.name }}/
      # Pages has no rewrite rules: serving index.html as the 404 page lets deep
      # links such as /Orrery/realworld/list open the app.
      - run: cp dist/web/browser/index.html dist/web/browser/404.html
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/web/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
